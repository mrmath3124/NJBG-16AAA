name: Update ratings

# MYHockey recalculates ratings on Wednesday mornings (October to April).
# Cron times are UTC: 13:30 and 17:30 UTC are 9:30 am and 1:30 pm Eastern
# during daylight time, 8:30 am and 12:30 pm in winter.
on:
  schedule:
    - cron: "30 13 * * 3"
    - cron: "30 17 * * 3"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: update-ratings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser
        run: |
          pip install playwright==1.47.0
          python -m playwright install --with-deps chromium

      - name: Check the parser
        run: python tests/test_parse.py

      - name: Fetch this week's ratings
        run: python scripts/update_ratings.py

      - name: Publish if anything changed
        run: |
          if git diff --quiet -- data/ratings.json; then
            echo "No change."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/ratings.json
            git commit -m "Ratings update $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Open an issue if the update failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Ratings update failed (${new Date().toISOString().slice(0, 10)})`,
              body: `The weekly MYHockey update did not finish. The site still shows last week's numbers.\n\nRun log: ${run}`
            });
